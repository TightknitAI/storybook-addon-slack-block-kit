version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  # `/` covers .github/workflows plus a root action.yml only. The
  # composite action's own SHA-pinned `uses:` steps live under
  # .github/actions/setup and must be listed to be kept current.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
