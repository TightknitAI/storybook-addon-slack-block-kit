name: Feature request
description: Suggest an idea or enhancement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you are trying to solve before jumping to a solution — it helps us evaluate alternatives.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
      placeholder: As a designer using Storybook, I want to flip the Slack preview between message and modal surfaces without rewriting every story.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? Sketch the API surface if it touches package exports, story parameters, or toolbar globals.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have weighed and why they fall short.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: Reminder — this addon is a thin Storybook wrapper around `slack-blocks-to-jsx`. Rendering improvements that aren't Storybook-specific belong upstream.
      options:
        - label: My request is about the Storybook integration (decorator, panel, toolbar, MDX) — not the underlying block-to-JSX renderer.
          required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
